name: Easy Apply

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID to apply to (from Supabase jobs table)'
        required: true
        type: string
      cv_only:
        description: 'Only build the tailored CV PDF (do not apply)'
        required: false
        type: boolean
        default: false

jobs:
  apply:
    name: Auto-fill Easy Apply form
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r cloud/requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Easy Apply executor
        env:
          SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:    ${{ secrets.SUPABASE_KEY }}
          # Cookie comes from Secrets now — bot_state no longer stores it
          LINKEDIN_COOKIE: ${{ secrets.LINKEDIN_COOKIE }}
          # Answers questions the saved answers do not cover
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          # Reads the private master CV (cv_master table) for the tailored CV
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID:          ${{ inputs.job_id }}
          CV_ONLY:         ${{ inputs.cv_only }}
        run: |
          if [ "$CV_ONLY" = "true" ]; then
            python cloud/apply_executor.py --job-id "$JOB_ID" --cv-only
          else
            python cloud/apply_executor.py --job-id "$JOB_ID"
          fi

      - name: Upload tailored CV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailored-cv-${{ github.run_id }}
          path: tailored_cv/*.pdf
          if-no-files-found: ignore
          # Public repo: artifacts are visible to signed-in GitHub users, and
          # the CV has contact details, so keep it only briefly.
          retention-days: 7
